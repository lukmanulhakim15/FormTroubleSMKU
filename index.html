<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IT Support Portal - Request Trouble</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary: #0b5cab;
      --primary-hover: #084985;
      --bg-gradient: linear-gradient(135deg, #0057b8 0%, #084fa8 42%, #003b7a 100%);
      --glass-bg: rgba(255, 255, 255, 0.95);
      --glass-border: rgba(255, 255, 255, 0.2);
      --text-main: #1e293b;
      --text-muted: #64748b;
      --input-bg: #f8fafc;
      --input-border: #e2e8f0;
      --input-focus: #0ea5e9;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background-color: #031530;
      /* Grid Geometris + Gradasi Biru Gelap */
      background-image: 
        linear-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.05) 1px, transparent 1px),
        linear-gradient(135deg, #020b18 0%, #072246 50%, #031530 100%);
      background-size: 50px 50px, 50px 50px, 100% 100%;
      
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px 16px;
      position: relative;
      overflow-x: hidden;
    }

    /* Bentuk Geometris Biru & Putih */
    body::before, 
    body::after {
      content: '';
      position: absolute;
      z-index: 0;
      pointer-events: none;
    }

    /* Poligon Kiri Atas (Gradasi Biru Cerah ke Putih) */
    body::before {
      width: 520px;
      height: 260px;
      top: -80px;
      left: -100px;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.95) 0%, rgba(14, 165, 233, 0.8) 40%, rgba(3, 105, 161, 0.1) 100%);
      clip-path: polygon(0 0, 100% 0, 70% 100%, 0 85%);
      transform: rotate(-15deg);
      filter: drop-shadow(0 10px 20px rgba(0, 0, 0, 0.3));
    }

    /* Poligon Kanan Bawah (Gradasi Putih Bersih ke Biru Cyan) */
    body::after {
      width: 500px;
      height: 280px;
      bottom: -100px;
      right: -90px;
      background: linear-gradient(135deg, rgba(3, 105, 161, 0.2) 0%, rgba(56, 189, 248, 0.8) 60%, rgba(255, 255, 255, 0.9) 100%);
      clip-path: polygon(30% 0, 100% 15%, 100% 100%, 0 100%);
      transform: rotate(-10deg);
      filter: drop-shadow(0 10px 20px rgba(0, 0, 0, 0.3));
    }

    .main-wrapper {
      width: 100%;
      max-width: 580px;
      z-index: 1;
    }

    .card {
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 24px;
      border: 1px solid var(--glass-border);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.35);
      padding: 40px;
      transition: transform 0.3s ease;
    }

    .header-section {
      text-align: center;
      margin-bottom: 32px;
    }

    .icon-badge {
      width: 280px;
      height: 94px;
      background: transparent;
      border-radius: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      margin-bottom: 16px;
      box-shadow: none;
      padding: 0;
    }

    .icon-badge img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .footer-note {
      margin-top: 22px;
      padding-top: 16px;
      border-top: 1px solid #e2e8f0;
      text-align: center;
      color: #64748b;
      font-size: 11px;
      line-height: 1.6;
    }

    .footer-note strong {
      color: #475569;
      font-weight: 700;
    }

    .header-section h1 {
      color: var(--text-main);
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
    }

    .header-section p {
      color: var(--text-muted);
      font-size: 14px;
    }

    .form-grid {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    /* RESPONSIVE */
    @media (max-width: 768px) {
      body {
        align-items: flex-start;
        padding: 18px 12px;
      }
      .main-wrapper { max-width: 680px; }
      .card {
        padding: 30px 24px;
        border-radius: 20px;
      }
      .header-section { margin-bottom: 26px; }
      .header-section h1 { font-size: clamp(22px, 5vw, 26px); }
    }

    @media (max-width: 520px) {
      body {
        padding: 10px;
        min-height: 100dvh;
      }
      .card {
        width: 100%;
        padding: 24px 16px;
        border-radius: 18px;
      }
      .icon-badge {
        width: 150px;
        height: 88px;
        border-radius: 14px;
      }
      .header-section { margin-bottom: 22px; }
      .header-section p {
        font-size: 12px;
        line-height: 1.55;
      }
      .form-grid { gap: 16px; }
      .form-row { grid-template-columns: 1fr; gap: 16px; }
      input, select, textarea {
        font-size: 16px; /* prevents mobile browser zoom */
        min-height: 48px;
      }
      textarea { min-height: 130px; }
      .search-select-menu {
        max-height: 220px;
      }
      .search-select-option {
        padding: 12px;
        font-size: 14px;
      }
      button#submitBtn {
        min-height: 50px;
        font-size: 14px;
      }
    }

    @media (max-width: 360px) {
      .card { padding: 20px 13px; }
      .header-section h1 { font-size: 20px; }
      label { font-size: 12px; }
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    label {
      font-size: 13px;
      font-weight: 700;
      color: #334155;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    label i {
      color: var(--primary);
      font-size: 14px;
    }

    .input-wrapper {
      position: relative;
    }

    input, select, textarea {
      width: 100%;
      padding: 12px 16px;
      background: var(--input-bg);
      border: 1.5px solid var(--input-border);
      border-radius: 12px;
      font-size: 14px;
      color: var(--text-main);
      font-weight: 500;
      outline: none;
      transition: all 0.2s ease;
    }

    input:focus, select:focus, textarea:focus {
      background: #ffffff;
      border-color: var(--input-focus);
      box-shadow: 0 0 0 4px rgba(14, 165, 233, 0.15);
    }

    textarea {
      resize: vertical;
      min-height: 110px;
    }
    /* Searchable Departement / Divisi dropdown */
    .search-select {
      position: relative;
    }

    .search-select > input[type="text"] {
      padding-right: 44px;
      cursor: text;
    }

    .search-select-arrow {
      position: absolute;
      top: 0;
      right: 0;
      width: 44px;
      height: 100%;
      margin: 0;
      padding: 0;
      background: transparent;
      color: #64748b;
      border: 0;
      border-radius: 12px;
      box-shadow: none;
      cursor: pointer;
      z-index: 3;
    }

    .search-select-arrow:hover,
    .search-select-arrow:active {
      transform: none;
      box-shadow: none;
      background: transparent;
      color: var(--primary);
    }

    .search-select-menu {
      position: absolute;
      left: 0;
      right: 0;
      top: calc(100% + 6px);
      max-height: 240px;
      overflow-y: auto;
      background: #ffffff;
      border: 1.5px solid #e2e8f0;
      border-radius: 12px;
      box-shadow: 0 16px 35px rgba(15, 23, 42, 0.16);
      padding: 6px;
      display: none;
      z-index: 20;
    }

    .search-select.open .search-select-menu {
      display: block;
    }

    .search-select-option {
      width: 100%;
      margin: 0;
      padding: 10px 12px;
      background: transparent;
      color: #334155;
      border: 0;
      border-radius: 8px;
      box-shadow: none;
      text-align: left;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: block;
    }

    .search-select-option:hover,
    .search-select-option.active {
      background: #eef2ff;
      color: var(--primary);
      transform: none;
    }

    .search-select-empty {
      padding: 12px;
      color: #94a3b8;
      font-size: 13px;
      text-align: center;
    }

    .search-select.other-mode > input[type="text"] {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.10);
    }


    button {
      margin-top: 10px;
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #0757a6 0%, #0ea5e9 100%);
      color: white;
      border: none;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 10px 25px -5px rgba(7, 87, 166, 0.35);
      transition: all 0.3s ease;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 30px -5px rgba(7, 87, 166, 0.45);
    }

    button:active {
      transform: translateY(0);
    }

    button:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }

    #status {
      margin-top: 16px;
      padding: 14px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      text-align: center;
      display: none;
      animation: fadeIn 0.3s ease;
    }

    #status.success {
      display: block;
      background: #dcfce7;
      color: #15803d;
      border: 1px solid #bbf7d0;
    }

    #status.error {
      display: block;
      background: #fee2e2;
      color: #b91c1c;
      border: 1px solid #fecaca;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

<div class="main-wrapper">
  <div class="card">
    <div class="header-section">
      <div class="icon-badge">
        <img src="images/Logo-smku.png" alt="Logo PT. Samugara Multikarya Utama">
      </div>
      <h1>IT Support Portal</h1>
      <p>Silakan isi formulir di bawah ini jika Anda mengalami kendala teknis</p>
    </div>

    <form id="troubleForm" class="form-grid">
      <div class="form-row">
        <div class="form-group">
          <label for="nama"><i class="fa-solid fa-user"></i> Nama Lengkap</label>
          <input type="text" id="nama" name="nama" required placeholder="John Doe">
        </div>

        <div class="form-group">
          <label for="email"><i class="fa-solid fa-envelope"></i> Email Staff</label>
          <input type="email" id="email" name="email" required placeholder="nama@perusahaan.com">
        </div>
      </div>

      <div class="form-group">
        <label for="tanggal"><i class="fa-solid fa-calendar-days"></i> Tanggal</label>
        <input type="date" id="tanggal" name="tanggal" required>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="divisiSearch"><i class="fa-solid fa-building"></i> Departement / Divisi</label>
          <div class="search-select" id="divisiSelect">
            <input type="text" id="divisiSearch" autocomplete="off" placeholder="Cari / pilih Departement..." aria-label="Cari Departement atau Divisi" required>
            <input type="hidden" id="divisi" name="divisi" required>
            <button type="button" class="search-select-arrow" aria-label="Buka pilihan departement">
              <i class="fa-solid fa-chevron-down"></i>
            </button>
            <div class="search-select-menu" id="divisiMenu" role="listbox"></div>
          </div>
        </div>

        <div class="form-group">
          <label for="kategoriSearch"><i class="fa-solid fa-list-check"></i> Kategori Issue</label>
          <div class="search-select" id="kategoriSelect">
            <input type="text" id="kategoriSearch" autocomplete="off" placeholder="Pilih Kategori Issue..." aria-label="Pilih Kategori Issue" required>
            <input type="hidden" id="kategori" name="kategori" required>
            <button type="button" class="search-select-arrow" aria-label="Buka pilihan kategori">
              <i class="fa-solid fa-chevron-down"></i>
            </button>
            <div class="search-select-menu" id="kategoriMenu" role="listbox"></div>
          </div>
        </div>
      </div>

      <div class="form-group">
        <label for="deskripsi"><i class="fa-solid fa-align-left"></i> Rincian Kendala</label>
        <textarea id="deskripsi" name="deskripsi" required placeholder="Jelaskan detail kendala yang terjadi, lokasi, atau pesan error yang muncul..."></textarea>
      </div>

      <button type="submit" id="submitBtn">
        <i class="fa-solid fa-paper-plane"></i>
        <span>Kirim Trouble Request</span>
      </button>
    </form>

    <div id="status"></div>

    <div class="footer-note">
      <strong>Note :</strong> Harap diisi sesuai dan benar &copy; 2026 IT Department
    </div>
  </div>
</div>

<script>
  // GANTI DENGAN WEB APP URL HASIL DEPLOYMENT GOOGLE APPS SCRIPT
  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzywLbKG-5-BZPiudte3G8qwLH635mMgNMSVkeFwY1i2_QIQLYdF4thPyhQIbunJ05K/exec';

  const form = document.getElementById('troubleForm');
  const statusDiv = document.getElementById('status');
  const submitBtn = document.getElementById('submitBtn');
  const tanggalInput = document.getElementById('tanggal');
  tanggalInput.value = new Date().toISOString().slice(0, 10);

  // Searchable Kategori Issue + pilihan Lainnya yang bisa diketik
  const kategoriSelect = document.getElementById('kategoriSelect');
  const kategoriSearch = document.getElementById('kategoriSearch');
  const kategoriHidden = document.getElementById('kategori');
  const kategoriMenu = document.getElementById('kategoriMenu');
  const kategoriArrow = kategoriSelect.querySelector('.search-select-arrow');

  const KATEGORI = [
    { value: 'Hardware', label: '💻 Hardware / Perangkat' },
    { value: 'Software', label: '⚙️ Software / Aplikasi' },
    { value: 'Jaringan', label: '🌐 Jaringan / Internet / Wi-Fi' },
    { value: 'Akses / Akun', label: '🔑 Akses / Akun & Password' },
    { value: 'Printer / Scanner', label: '🖨️ Printer / Scanner' },
    { value: 'Lainnya', label: '❓ Lainnya' }
  ];

  function renderKategoriOptions(keyword = '') {
    const query = keyword.trim().toLowerCase();
    const filtered = KATEGORI.filter(item => item.label.toLowerCase().includes(query));
    kategoriMenu.innerHTML = '';

    if (!filtered.length) {
      kategoriMenu.innerHTML = '<div class="search-select-empty">Kategori tidak ditemukan</div>';
      return;
    }

    filtered.forEach(item => {
      const option = document.createElement('button');
      option.type = 'button';
      option.className = 'search-select-option';
      option.textContent = item.label;
      option.setAttribute('role', 'option');
      option.addEventListener('mousedown', e => e.preventDefault());
      option.addEventListener('click', () => selectKategori(item.value, item.label));
      kategoriMenu.appendChild(option);
    });
  }

  function openKategori() {
    renderKategoriOptions(kategoriSelect.classList.contains('other-mode') ? '' : kategoriSearch.value);
    kategoriSelect.classList.add('open');
  }

  function closeKategori() {
    kategoriSelect.classList.remove('open');
  }

  function selectKategori(value, label) {
    if (value === 'Lainnya') {
      kategoriSelect.classList.add('other-mode');
      kategoriSearch.value = '';
      kategoriSearch.placeholder = 'Ketik kategori issue...';
      kategoriHidden.value = '';
      kategoriSearch.setCustomValidity('Silakan ketik kategori issue.');
      closeKategori();
      setTimeout(() => kategoriSearch.focus(), 50);
      return;
    }

    kategoriSelect.classList.remove('other-mode');
    kategoriSearch.placeholder = 'Pilih Kategori Issue...';
    kategoriSearch.value = label;
    kategoriHidden.value = value;
    kategoriSearch.setCustomValidity('');
    closeKategori();
  }

  kategoriSearch.addEventListener('focus', openKategori);
  kategoriSearch.addEventListener('input', () => {
    if (kategoriSelect.classList.contains('other-mode')) {
      kategoriHidden.value = kategoriSearch.value.trim();
      kategoriSearch.setCustomValidity(
        kategoriHidden.value ? '' : 'Silakan ketik kategori issue.'
      );
      return;
    }

    kategoriHidden.value = '';
    kategoriSearch.setCustomValidity('Silakan pilih kategori dari daftar.');
    openKategori();
  });

  kategoriArrow.addEventListener('click', () => {
    if (kategoriSelect.classList.contains('open')) closeKategori();
    else {
      kategoriSearch.focus();
      openKategori();
    }
  });

  // Searchable Departement / Divisi dropdown
  const divisiSelect = document.getElementById('divisiSelect');
  const divisiSearch = document.getElementById('divisiSearch');
  const divisiHidden = document.getElementById('divisi');
  const divisiMenu = document.getElementById('divisiMenu');
  const divisiArrow = divisiSelect.querySelector('.search-select-arrow');

  const DEPARTMENTS = [
  
    'HR',
    'HSSE',
    'IT',
    'KEUANGAN',
    'PURCHASING',
    'SECURITY',
    'GUDANG',
    'PRODUKSI',
    'LAINYA'
  ];

  function renderDivisiOptions(keyword = '') {
    const query = keyword.trim().toLowerCase();
    const filtered = DEPARTMENTS.filter(item => item.toLowerCase().includes(query));
    divisiMenu.innerHTML = '';

    if (!filtered.length) {
      divisiMenu.innerHTML = '<div class="search-select-empty">Departement tidak ditemukan</div>';
      return;
    }

    filtered.forEach(item => {
      const option = document.createElement('button');
      option.type = 'button';
      option.className = 'search-select-option';
      option.textContent = item;
      option.setAttribute('role', 'option');
      option.addEventListener('mousedown', e => e.preventDefault());
      option.addEventListener('click', () => selectDivisi(item));
      divisiMenu.appendChild(option);
    });
  }

  function openDivisi() {
    renderDivisiOptions(divisiSearch.value);
    divisiSelect.classList.add('open');
  }

  function closeDivisi() {
    divisiSelect.classList.remove('open');
  }

  function selectDivisi(value) {
    if (value === 'LAINYA') {
      // LAINYA selalu paling bawah. Setelah dipilih, input menjadi bebas untuk diketik.
      divisiSelect.classList.add('other-mode');
      divisiSearch.value = '';
      divisiSearch.placeholder = 'Ketik Departement / Divisi...';
      divisiHidden.value = '';
      divisiSearch.setCustomValidity('Silakan ketik Departement / Divisi.');
      closeDivisi();
      setTimeout(() => divisiSearch.focus(), 50);
      return;
    }

    divisiSelect.classList.remove('other-mode');
    divisiSearch.placeholder = 'Cari / pilih Departement...';
    divisiSearch.value = value;
    divisiHidden.value = value;
    divisiSearch.setCustomValidity('');
    closeDivisi();
  }

  divisiSearch.addEventListener('focus', openDivisi);
  divisiSearch.addEventListener('input', () => {
    if (divisiSelect.classList.contains('other-mode')) {
      // Mode LAINYA: apa pun yang diketik menjadi nilai divisi.
      divisiHidden.value = divisiSearch.value.trim();
      divisiSearch.setCustomValidity(
        divisiHidden.value ? '' : 'Silakan ketik Departement / Divisi.'
      );
      return;
    }

    // Mode pencarian biasa: tetap harus memilih dari daftar.
    divisiHidden.value = '';
    divisiSearch.setCustomValidity('Silakan pilih departement dari daftar.');
    openDivisi();
  });

  divisiArrow.addEventListener('click', () => {
    if (divisiSelect.classList.contains('open')) closeDivisi();
    else {
      divisiSearch.focus();
      openDivisi();
    }
  });

  document.addEventListener('click', e => {
    if (!divisiSelect.contains(e.target)) closeDivisi();
    if (!kategoriSelect.contains(e.target)) closeKategori();
  });

  divisiSearch.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeDivisi();
  });

  kategoriSearch.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeKategori();
  });

  function createRequestId() {
    return (window.crypto && crypto.randomUUID)
      ? crypto.randomUUID()
      : 'req-' + Date.now() + '-' + Math.random().toString(36).slice(2);
  }

  function getStatusByJsonp(requestId) {
    return new Promise((resolve, reject) => {
      const callbackName = 'requestStatus_' + Date.now() + '_' + Math.random().toString(36).slice(2);
      const script = document.createElement('script');
      const timeout = setTimeout(() => { cleanup(); reject(new Error('Timeout')); }, 3000);

      window[callbackName] = data => {
        clearTimeout(timeout);
        cleanup();
        resolve(data);
      };

      function cleanup() {
        delete window[callbackName];
        script.remove();
      }

      script.onerror = () => {
        clearTimeout(timeout);
        cleanup();
        reject(new Error('Gagal mengambil status request.'));
      };

      script.src = SCRIPT_URL + '?action=status&requestId=' +
        encodeURIComponent(requestId) + '&callback=' + encodeURIComponent(callbackName);
      document.body.appendChild(script);
    });
  }

  async function waitForQueueNumber(requestId) {
    for (let i = 0; i < 5; i++) {
      try {
        const result = await getStatusByJsonp(requestId);
        if (result && result.found && result.queueNumber) return result;
      } catch (error) {
        console.warn(error);
      }
      await new Promise(resolve => setTimeout(resolve, [0, 250, 400, 600, 800][i] || 800));
    }
    return null;
  }

  form.addEventListener('submit', async e => {
    e.preventDefault();

    submitBtn.disabled = true;
    submitBtn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> <span>Mengirim Request...</span>';
    statusDiv.className = '';
    statusDiv.style.display = 'none';

    const requestId = createRequestId();
    const payload = {
      requestId,
      nama: form.nama.value.trim(),
      email: form.email.value.trim(),
      tanggal: form.tanggal.value,
      divisi: form.divisi.value.trim(),
      kategori: form.kategori.value,
      deskripsi: form.deskripsi.value.trim()
    };

    try {
      await fetch(SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      });

      statusDiv.className = 'success';
      statusDiv.innerHTML =
        '<i class="fa-solid fa-circle-notch fa-spin"></i> Request diterima, mengambil nomor antrian...';
      statusDiv.style.display = 'block';

      const result = await waitForQueueNumber(requestId);

      if (result && result.queueNumber) {
        statusDiv.innerHTML =
          '<div style="font-size:13px;margin-bottom:5px;">REQUEST BERHASIL DIKIRIM</div>' +
          '<div style="font-size:28px;font-weight:800;margin:4px 0 8px;">🎫 ' +
          result.queueNumber + '</div>' +
          '<div style="font-size:13px;">Simpan nomor antrian ini untuk referensi laporan Anda.</div>';
        form.reset();
        tanggalInput.value = new Date().toISOString().slice(0, 10);
        divisiSelect.classList.remove('other-mode');
        divisiSearch.placeholder = 'Cari / pilih Departement...';
        divisiHidden.value = '';
        kategoriSelect.classList.remove('other-mode');
        kategoriSearch.placeholder = 'Pilih Kategori Issue...';
        kategoriHidden.value = '';
      } else {
        statusDiv.innerHTML =
          '<i class="fa-solid fa-circle-check"></i> Request sudah dikirim. Nomor antrian akan dikirim ke email Anda jika email valid.';
        form.reset();
        tanggalInput.value = new Date().toISOString().slice(0, 10);
        divisiSelect.classList.remove('other-mode');
        divisiSearch.placeholder = 'Cari / pilih Departement...';
        divisiHidden.value = '';
        kategoriSelect.classList.remove('other-mode');
        kategoriSearch.placeholder = 'Pilih Kategori Issue...';
        kategoriHidden.value = '';
      }
    } catch (error) {
      statusDiv.className = 'error';
      statusDiv.innerHTML =
        '<i class="fa-solid fa-triangle-exclamation"></i> Gagal mengirim request. Silakan periksa koneksi dan coba lagi.';
      console.error(error);
    } finally {
      submitBtn.disabled = false;
      submitBtn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> <span>Kirim Trouble Request</span>';
    }
  });
</script>

</body>
</html>
